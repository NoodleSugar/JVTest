[package]
name = "fear_itself_game"
authors = ["Sugar Noodle"]
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["3d", "ui"] }
avian3d = { version = "0.8" }
bevy-tnua = { version = "0.33" }
bevy-tnua-avian3d = { version = "0.13" }
bevy_enhanced_input = { version = "0.27" }

tracing = { version = "0.1" }

# Optimize logs for bevy
log = { version = "*", features = [
	"max_level_debug",
	"release_max_level_warn",
] }

[features]
default = ["dev"]
dev = [
	"bevy/dynamic_linking",
	"bevy/debug",
	"bevy/bevy_dev_tools",
	"bevy/render_dev_tools",
]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = "debuginfo"
